[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-thesis"
version = "0.1.0"
description = "Explainable graph-based medical imaging research pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
medical = [
  "pydicom>=2.4",
  "SimpleITK>=2.3",
  "pyradiomics>=3.1",
]
graph = ["torch-geometric>=2.5"]
quantum = ["pennylane==0.45.1"]
annotation = ["napari[all]>=0.8", "imageio>=2.37", "tifffile>=2025.1"]
report = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "nltk>=3.9",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.5",
  "scikit-learn>=1.4",
]
translation = [
  "huggingface-hub>=0.28",
  "sentencepiece>=0.2",
  "transformers>=4.48,<6",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
